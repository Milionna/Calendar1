<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Календарь: Работа И и общий</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- iOS PWA поддержка -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Календарь">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f4f8fb">
<style>
:root{--bg:#f4f8fb;--card:#fff;--tx:#1e293b;--mut:#64748b;--ac:#3b82f6;--ach:#1d4ed8;--lt:#eff6ff;--bd:#cbd5e1;--sh:0 4px 20px -2px rgba(59,130,246,.08);--f:#99f6e4;--p:#fde68a;--w:#e2e8f0;--o:#fca5a5;--n:#6ee7b7;--i:#93c5fd;--b:#c4b5fd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a2b;--card:#17243a;--tx:#e6eefc;--mut:#94a8c7;--ac:#4d8dff;--ach:#9cc2ff;--lt:#1d3354;--bd:#33466a;--sh:none;--w:#33415c}}
:root[data-theme="dark"]{--bg:#0f1a2b;--card:#17243a;--tx:#e6eefc;--mut:#94a8c7;--ac:#4d8dff;--ach:#9cc2ff;--lt:#1d3354;--bd:#33466a;--sh:none;--w:#33415c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 -apple-system,"SF Pro Text",system-ui,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 12px 100px}
button,input,textarea,select{font:inherit;color:var(--tx)}
h1{font-size:24px;margin:0}
.top,.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav{margin:12px 0}.nav b{font-size:20px}
.ib{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:var(--sh)}
.tabs,.seg{display:flex;gap:6px;background:var(--lt);padding:4px;border-radius:14px;margin-top:10px}
.tabs button,.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;cursor:pointer;font-size:15px}
.tabs button.on,.seg button.on{background:var(--ac);color:#fff;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;color:var(--mut);font-size:13px;padding:4px 0}
.cell{aspect-ratio:1/1.2;border:1px solid transparent;border-radius:12px;background:var(--card);box-shadow:var(--sh);padding:3px;display:flex;flex-direction:column;align-items:center;gap:1px;overflow:hidden;cursor:pointer;color:var(--tx);min-width:0}
.dn{font-weight:600;font-size:15px}.cell small{font-size:11px}
.s-f{background:var(--f);color:#0f172a}.s-p{background:var(--p);color:#0f172a}.s-w{background:var(--w)}.s-o{background:var(--o);color:#0f172a}
.cell.today{border:2px solid var(--ac)}.cell.sel{background:var(--lt)}
.pill{font-style:normal;font-size:10px;line-height:1.3;border-radius:6px;padding:0 3px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#0f172a}
.o-N{background:var(--n)}.o-I{background:var(--i)}.o-B{background:var(--b)}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--mut);margin:10px 2px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:14px;margin-top:12px;border:1px solid rgba(59,130,246,.1)}
.ev{display:block;width:100%;text-align:left;border:0;border-left:6px solid;border-radius:10px;background:var(--lt);padding:9px 10px;margin-top:8px;cursor:pointer}
.ev.o-N{border-color:var(--n)}.ev.o-I{border-color:var(--i)}.ev.o-B{border-color:var(--b)}
#fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 8px 20px rgba(59,130,246,.35);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sheet h3{margin:0 0 6px}label{display:block;margin-top:12px;font-size:14px;color:var(--mut)}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:10px 12px;margin-top:4px}
input:focus,textarea:focus,select:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 1px #3b82f6}
.row{display:flex;gap:10px;margin-top:16px}.btn{flex:1;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:12px;padding:12px;font-weight:600;cursor:pointer}
.btn.gh{background:var(--card);color:var(--tx);border-color:var(--bd)}.btn:hover{background:var(--ach);border-color:var(--ach);color:#fff}
.chk{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:16px}.chk input{width:20px;height:20px;margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="app"></main>
<div id="md"></div>
<script>
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const ST={F:['Полный рабочий','s-f'],P:['Неполный','s-p'],W:['Выходной','s-w'],O:['Отгул / больничный','s-o']};
const OW={N:'🟢 Настя',I:'🔵 Илья',B:'🟣 Вместе'};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const p2=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=k=>{const[a,b,c]=k.split('-');return +c+' '+MN[b-1].toLowerCase().replace(/ь$/,'я').replace(/т$/,'та').replace(/й$/,'я')+' '+a};
let wl=ld('wl',{}),ev=ld('ev',[]);const now=new Date();
let Y=now.getFullYear(),M=now.getMonth(),tab='w',sel=iso(now);
const app=document.getElementById('app'),md=document.getElementById('md');
const evs=k=>ev.filter(e=>e.d===k).sort((a,b)=>(a.ad?'00':a.s||'99').localeCompare(b.ad?'00':b.s||'99'));
function render(){
 const first=(new Date(Y,M,1).getDay()+6)%7,n=new Date(Y,M+1,0).getDate(),td=iso(new Date());
 let g=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="wd">${x}</div>`).join('')+'<div></div>'.repeat(first);
 for(let d=1;d<=n;d++){const k=Y+'-'+p2(M+1)+'-'+p2(d),wd=(first+d-1)%7;let c='cell',h=`<span class="dn">${d}</span>`;
  if(tab==='w'){const r=wl[k],s=r?r.s:(wd>4?'W':'');if(s)c+=' '+ST[s][1];if(r&&r.s==='P')h+=`<small>${r.h} ч</small>`;if(r&&r.r)h+='<small>📝</small>'}
  else{const es=evs(k);h+=es.slice(0,2).map(e=>`<i class="pill o-${e.o}" data-e="${e.id}">${esc(e.t)}</i>`).join('')+(es.length>2?`<small>+${es.length-2}</small>`:'');if(k===sel)c+=' sel'}
  if(k===td)c+=' today';g+=`<button class="${c}" data-d="${k}">${h}</button>`}
 const leg=tab==='w'?`<div class="leg"><span><i style="background:var(--f)"></i>Полный</span><span><i style="background:var(--p)"></i>Неполный</span><span><i style="background:var(--w)"></i>Выходной</span><span><i style="background:var(--o)"></i>Отгул / больничный</span></div>`:`<div class="leg"><span><i style="background:var(--n)"></i>Настя</span><span><i style="background:var(--i)"></i>Илья</span><span><i style="background:var(--b)"></i>Вместе</span></div>`;
 let low='';
 if(tab==='w'){let t=0,dd=0;for(const k in wl)if(k.startsWith(Y+'-'+p2(M+1))){const r=wl[k];if(r.s==='F'){dd++;t+=8}else if(r.s==='P'){dd++;t+=+r.h||0}}low=`<div class="card">Отмечено рабочих дней: <b>${dd}</b>. Часов (полный день = 8): <b>${t}</b></div>`}
 else{const es=evs(sel);low=`<div class="card"><b>${fmt(sel)}</b>${es.length?es.map(e=>`<button class="ev o-${e.o}" data-e="${e.id}"><b>${e.ad?'Весь день':(e.s||'')+(e.e?'–'+e.e:'')}</b> ${esc(e.t)}${e.r?' 🔔':''}<br><small>${OW[e.o]}${e.n?' · '+esc(e.n):''}</small></button>`).join(''):'<p style="color:var(--mut);margin:8px 0 0">Событий нет</p>'}</div><button id="fab" data-a="add">+</button>`}
 app.innerHTML=`<div class="top"><h1>${tab==='w'?'Работа И':'Общий календарь'}</h1><button class="ib" data-a="today">Сегодня</button></div>
 <div class="tabs"><button data-t="w" class="${tab==='w'?'on':''}">Работа И</button><button data-t="s" class="${tab==='s'?'on':''}">Общий календарь сит</button></div>
 <div class="nav"><button class="ib" data-a="pv">‹</button><b>${MN[M]} ${Y}</b><button class="ib" data-a="nx">›</button></div><div class="grid">${g}</div>${leg}${low}`}
function openM(h){md.innerHTML='<div class="ov"><div class="sheet">'+h+'</div></div>'}
const closeM=()=>{md.innerHTML=''};
function workModal(k){const r=wl[k]||{s:'F'};
 openM(`<h3>${fmt(k)}</h3><div class="seg" id="seg">${Object.keys(ST).map(s=>`<button data-s="${s}" class="${s===r.s?'on':''}">${ST[s][0]}</button>`).join('')}</div>
 <label id="hl" ${r.s==='P'?'':'hidden'}>Отработано часов<input id="h" type="number" step="0.5" min="0" max="24" inputmode="decimal" value="${r.h||''}"></label>
 <label>Причина / примечание<textarea id="r" rows="3" placeholder="Например: ушёл в 15:00 к врачу">${esc(r.r||'')}</textarea></label>
 <div class="row"><button class="btn gh" data-a="wreset" data-k="${k}">Сбросить</button><button class="btn" data-a="wsave" data-k="${k}">Сохранить</button></div>`)}
function evModal(id){const e=ev.find(x=>x.id===id)||{d:sel,o:'B',ad:false,r:''};
 openM(`<h3>${id?'Редактирование встречи':'Новая встреча'}</h3>
 <label>Название<input id="t" type="text" value="${esc(e.t||'')}" placeholder="Урок испанского"></label>
 <label>Дата<input id="d" type="date" value="${e.d}"></label>
 <label class="chk"><input id="ad" type="checkbox" ${e.ad?'checked':''}> Весь день</label>
 <div class="row" id="tm" ${e.ad?'hidden':''} style="margin-top:0"><label style="flex:1">Начало<input id="s" type="time" value="${e.s||''}"></label><label style="flex:1">Конец<input id="e" type="time" value="${e.e||''}"></label></div>
 <label>Кто</label><div class="seg" id="own">${Object.keys(OW).map(o=>`<button data-o="${o}" class="${o===e.o?'on':''}">${OW[o]}</button>`).join('')}</div>
 <label>Описание<textarea id="n" rows="3" placeholder="Подробности, адрес, заметки">${esc(e.n||'')}</textarea></label>
 <label>Напоминание<select id="rm"><option value="">Нет</option><option value="h" ${e.r==='h'?'selected':''}>За 1 час</option><option value="d" ${e.r==='d'?'selected':''}>За 1 день</option></select></label>
 <div class="row">${id?`<button class="btn gh" data-a="edel" data-id="${id}">Удалить</button>`:''}<button class="btn" data-a="esave" data-id="${id||''}">Сохранить</button></div>`)}
const val=i=>document.getElementById(i);
md.onclick=e=>{const t=e.target;if(t.classList.contains('ov'))return closeM();
 if(t.closest('#seg')&&t.dataset.s){document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b===t));val('hl').hidden=t.dataset.s!=='P';return}
 if(t.closest('#own')&&t.dataset.o){document.querySelectorAll('#own button').forEach(b=>b.classList.toggle('on',b===t));return}
 if(t.id==='ad'){val('tm').hidden=t.checked;return}
 const a=t.dataset.a;if(!a)return;
 if(a==='wsave'){const s=document.querySelector('#seg .on').dataset.s,h=+val('h').value;if(s==='P'&&!(h>0)){val('h').focus();return}
  wl[t.dataset.k]={s,h:s==='P'?h:undefined,r:val('r').value.trim()};sv('wl',wl);closeM();render()}
 if(a==='wreset'){delete wl[t.dataset.k];sv('wl',wl);closeM();render()}
 if(a==='esave'){const ti=val('t').value.trim();if(!ti){val('t').focus();return}
  const o={id:t.dataset.id||'e'+Date.now(),t:ti,d:val('d').value||sel,ad:val('ad').checked,s:val('s').value,e:val('e').value,o:document.querySelector('#own .on').dataset.o,r:val('rm').value,n:val('n').value.trim(),f:false};
  ev=ev.filter(x=>x.id!==o.id).concat(o);sv('ev',ev);sel=o.d;if(o.r&&window.Notification&&Notification.permission==='default')Notification.requestPermission();closeM();render()}
 if(a==='edel'){ev=ev.filter(x=>x.id!==t.dataset.id);sv('ev',ev);closeM();render()}};
app.onclick=e=>{const pe=e.target.closest('[data-e]');if(pe){evModal(pe.dataset.e);return}const t=e.target.closest('button');if(!t)return;const a=t.dataset.a;
 if(t.dataset.t){tab=t.dataset.t;render()}
 else if(t.dataset.d){if(tab==='w')workModal(t.dataset.d);else{sel=t.dataset.d;render();evModal('')}}
 else if(t.dataset.e)evModal(t.dataset.e);
 else if(a==='add')evModal('');
 else if(a==='today'){const n=new Date();Y=n.getFullYear();M=n.getMonth();sel=iso(n);render()}
 else if(a==='pv'||a==='nx'){M+=a==='pv'?-1:1;if(M<0){M=11;Y--}if(M>11){M=0;Y++}render()}};
setInterval(()=>{try{if(!window.Notification||Notification.permission!=='granted')return;const n=Date.now();let ch=false;
 ev.forEach(e=>{if(!e.r||e.f)return;const st=new Date(e.d+'T'+(e.ad||!e.s?'09:00':e.s)).getTime(),fire=st-(e.r==='h'?36e5:864e5);
  if(n>=fire&&n<st){new Notification(e.t,{body:(e.ad?'Весь день':e.s)+' · '+fmt(e.d)});e.f=true;ch=true}});if(ch)sv('ev',ev)}catch(x){}},30000);
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').then((reg) => {
      reg.onupdatefound = () => {
        const installingWorker = reg.installing;
        installingWorker.onstatechange = () => {
          if (installingWorker.state === 'installed') {
            if (navigator.serviceWorker.controller) {
              // Новое обновление доступно — автоматически обновляем страницу
              console.log('Новое обновление загружено. Перезагрузка...');
              window.location.reload();
            }
          }
        };
      };
    });
  });
}
render();
</script>
</body>
</html>
